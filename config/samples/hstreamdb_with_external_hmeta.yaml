apiVersion: v1
kind: Namespace
metadata:
  name: hstreamdb
---
apiVersion: v1
kind: Service
metadata:
  name: hstreamdb-sample
  namespace: hstreamdb
spec:
  selector:
    hstream.io/instance: hstreamdb-sample
  type: ClusterIP
  ports:
    - name: port
      port: 14789
---
apiVersion: v1
kind: Service
metadata:
  name: hstreamdb-sample-console
  namespace: hstreamdb
spec:
  selector:
    hstream.io/instance: hstreamdb-sample
    hstream.io/component: console
  type: NodePort
  ports:
    - name: port
      port: 5177
      targetPort: server-port
      nodePort: 31777
---
apiVersion: apps.hstream.io/v1alpha2
kind: HStreamDB
metadata:
  labels:
    app.kubernetes.io/name: hstreamdb
    app.kubernetes.io/instance: hstreamdb-sample
    app.kubernetes.io/part-of: hstream-operator
    app.kuberentes.io/managed-by: kustomize
    app.kubernetes.io/created-by: hstream-operator
  name: hstreamdb-sample
  namespace: hstreamdb
spec:
  adminServer:
    image: hstreamdb/hstream:rqlite
    imagePullPolicy: IfNotPresent
    replicas: 1
    container:
      name: admin-server
  console:
    image: hstreamdb/hstream-console
    imagePullPolicy: IfNotPresent
    replicas: 1
    container:
      name: console
      env:
        - name: HSTREAM_PUBLIC_ADDRESS
          value: hstreamdb-sample.hstreamdb:6570
          # The PROMETHEUS_URL will be used to show the metrics of HStream cluster on the console dashboard.
        - name: PROMETHEUS_URL
          value: http://localhost:9090
  hserver:
    image: hstreamdb/hstream:rqlite
    imagePullPolicy: IfNotPresent
    replicas: 1
    container:
      name: hserver
  rqlite:
    host: hstreamdb-internal-rqlite
    port: 80
    namespace: hstreamdb
  hstore:
    image: hstreamdb/hstream:rqlite
    imagePullPolicy: IfNotPresent
    replicas: 3
    container:
      name: hstore
    # volumeClaimTemplate:
    #   spec:
    #     storageClassName: "standard"
    #     resources:
    #       requests:
    #         storage: 1Gi
